<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ----------------------  GENERAL  ---------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f7f9;
            color: #333;
        }

        /* ----------------------  NAVIGATION  ---------------------- */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #003366;
            padding: 15px 0;
            text-align: center;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .top-nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .top-nav a:hover {
            text-decoration: underline;
        }

        header {
            margin-top: 100px;
            text-align: center;
        }

        .logo {
            width: 180px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: #003366;
            margin: 0;
        }

        /* ----------------------  RESET BOX  ---------------------- */
        .reset-box {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: left;
        }

        .reset-box p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .reset-box label {
            font-size: 14px;
            font-weight: bold;
            color: #003366;
            display: block;
            margin-bottom: 8px;
        }

        .reset-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .reset-box input:focus {
            border-color: #FF6600;
        }

        .btn-reset {
            width: 100%;
            background: #FF6600; /* توحيد اللون البرتقالي */
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: #e65c00;
        }

        .extra-links {
            text-align: center;
            margin-top: 20px;
        }

        .extra-links a {
            color: #003366;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        /* ----------------------  FOOTER  ---------------------- */
        .footer {
            background: #003366;
            color: white;
            padding: 25px 10px;
            text-align: center;
            margin-top: 60px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<nav class="top-nav">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="contact.html">Support</a>
  <a href="login.html">Login</a>
</nav>

<header>
    <img src="logo.png" alt="BELG SERVICES Logo" class="logo">
    <h1>Reset Password</h1>
</header>

<div class="reset-box">
    <p>
        Please enter your email address. We will send you a secure link to reset your password.
    </p>

    <form id="resetForm">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="e.g. info@company.com" required>

        <button type="submit" class="btn-reset" id="resetBtn">Send Reset Link</button>
    </form>

    <div class="extra-links">
        <a href="login.html">← Back to Login</a>
    </div>
</div>

<footer class="footer">
  <p>© 2026 BELG SERVICES — All Rights Reserved</p>
  <p>Contact: info@belg-services.com</p>
</footer>

<script>
    // إعدادات Supabase (مطابقة لملفاتك السابقة)
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value;
        const btn = document.getElementById('resetBtn');

        btn.innerText = "Sending...";
        btn.disabled = true;

        // وظيفة Supabase لإرسال بريد إعادة تعيين كلمة المرور
        const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/update-password.html', // يجب أن تنشئ هذا الملف لاحقاً
        });

        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("Success! Check your email for the reset link.");
        }

        btn.innerText = "Send Reset Link";
        btn.disabled = false;
    });
</script>

</body>
</html>
