<div class="navbar">
    <div class="logo-area">
        <img src="logo.png" alt="BELG SERVICES" class="logo-img" onerror="this.src='https://placehold.co/60x60?text=BS'">
        <span class="logo-text" style="font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #FF6600, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent;">BELG SERVICES</span>
    </div>

    <div id="auth-ui-container" style="display: flex; align-items: center; gap: 15px;">
        <div id="guest-ui">
            <a href="login.html" style="text-decoration:none; color:#2c3e2f; font-weight:600; margin-right:15px;">Login</a>
            <a href="register.html" style="background:#FF6600; color:white; padding:8px 20px; border-radius:20px; text-decoration:none; font-weight:700;">Join Now</a>
        </div>

        <div id="user-ui" style="display:none; align-items:center; gap:12px;">
            <div style="text-align: right; line-height: 1.2;">
                <div id="nav-user-name" style="font-weight:700; font-size:0.9rem; color:#2c3e2f;">User</div>
                <span id="nav-role-badge" style="background:#27ae60; color:white; padding:2px 8px; border-radius:4px; font-size:0.65rem; font-weight:800; display:inline-block;">...</span>
            </div>

            <div id="nav-avatar" style="width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg, #FF6600, #FF8C00); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,0.1); overflow:hidden;">
                <span id="nav-initials"></span>
                <img id="nav-img" src="" style="display:none; width:100%; height:100%; object-fit:cover;">
            </div>

            <button onclick="handleLogout()" style="background:none; border:none; color:#ff4757; cursor:pointer; font-size: 1.1rem;">
                <i class="fas fa-power-off"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initNavigation() {
        try {
            const { data: { user } } = await _supabase.auth.getUser();

            if (user) {
                const { data: profiles } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id);

                const profile = (profiles && profiles.length > 0) ? profiles[0] : null;

                if (profile) {
                    document.getElementById('guest-ui').style.display = 'none';
                    document.getElementById('user-ui').style.display = 'flex';

                    // تحويل الرتبة لنص عربي للشارة
                    const roleNames = { 'company': 'شركة', 'worker': 'عامل', 'client': 'زبون' };
                    document.getElementById('nav-user-name').innerText = profile.full_name || 'User';
                    document.getElementById('nav-role-badge').innerText = roleNames[profile.user_type] || 'مستخدم';

                    // الحرف الأول
                    const nameForInitials = profile.full_name || user.email;
                    document.getElementById('nav-initials').innerText = nameForInitials.charAt(0).toUpperCase();

                    if (profile.avatar_url) {
                        const img = document.getElementById('nav-img');
                        img.src = profile.avatar_url;
                        img.style.display = 'block';
                        document.getElementById('nav-initials').style.display = 'none';
                    }
                }
            }
        } catch (err) { console.log("Nav system idle"); }
    }

    async function handleLogout() {
        await _supabase.auth.signOut();
        window.location.reload();
    }

    initNavigation();
</script>
