<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
<body>

    <div class="settings-container">
        <div class="settings-card">
            <h2 class="card-title">Profile Settings</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Smith">
            </div>
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="jobTitle" placeholder="e.g. Electrician">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="location" placeholder="City, Street">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-cancel" onclick="window.history.back()">Cancel</button>
            <button class="btn-save" onclick="saveSettings()">Save Changes</button>
        </div>
    </div>

    <script>
        // الربط المباشر بمفاتيحك
        const SUPABASE_URL = 'https://yyhh1140-stack-s.supabase.co'; // تم استخراجه من بياناتك
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY'; // تأكد من وضع المفتاح الصحيح هنا
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function saveSettings() {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) return alert("You must be logged in.");

            const updateData = {
                full_name: document.getElementById('fullName').value,
                title: document.getElementById('jobTitle').value,
                location: document.getElementById('location').value
            };

            // استخدام upsert لضمان الحفظ سواء كان المستخدم موجوداً أم لا
            const { error } = await sb
                .from('worker_profiles')
                .upsert({ id: user.id, ...updateData });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert("Settings saved successfully!");
            }
        }
    </script>
</body>
</html>
