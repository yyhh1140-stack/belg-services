<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Settings - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #1e2a2f; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: white; border-bottom: 1px solid #f0e4d8; flex-wrap: wrap; gap: 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #c49a6c, #8b5a2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #2c3e2f; transition: 0.2s; }
        .nav-links a:hover { color: #c49a6c; }
        .settings-container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
        .settings-header { margin-bottom: 32px; }
        .settings-card { background: white; border-radius: 32px; padding: 28px; margin-bottom: 28px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); border: 1px solid #f0e4d8; }
        .card-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 24px; color: #1e2a2f; border-left: 4px solid #c49a6c; padding-left: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: #2c3e2f; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2cfbc; border-radius: 60px; font-size: 0.9rem; }
        .btn-save { background: #c49a6c; color: white; border: none; padding: 12px 32px; border-radius: 60px; font-weight: 600; cursor: pointer; }
        .action-buttons { display: flex; gap: 16px; justify-content: flex-end; margin-top: 20px; }
        .user-type-badge { display: inline-block; padding: 6px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; margin-bottom: 20px; }
        .badge-worker { background: #d4f5d0; color: #2e6b1f; }
        .badge-company { background: #ffe0b3; color: #b45f06; }
        .badge-client { background: #e0e7ff; color: #1e3a8a; }
        .loading { text-align: center; padding: 40px; }
        .error-message { color: #e74c3c; background: #ffe0e0; padding: 12px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo-area">
        <span class="logo-text">BELG SERVICES</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboardr.html">Dashboard</a></li>
        <li><a href="worker-dashboard.html">Workers</a></li>
    </ul>
</div>

<div class="settings-container" id="settingsContainer">
    <div class="settings-card">
        <h2 class="card-title">Profile Settings</h2>
        <div id="userTypeBadge"></div>
        <div id="messageArea"></div>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+32 123 456 789">
        </div>
        <div class="form-group" id="workTypeGroup" style="display: none;">
            <label>Work Type (Workers only)</label>
            <input type="text" id="workType" placeholder="e.g., Cleaning, Moving, Painting">
        </div>
        <div class="form-group" id="priceGroup" style="display: none;">
            <label>Hourly Rate ($) - Workers only</label>
            <input type="number" id="price" placeholder="25">
        </div>
        <div class="form-group" id="businessCategoryGroup" style="display: none;">
            <label>Business Category (Companies only)</label>
            <input type="text" id="businessCategory" placeholder="e.g., Cleaning, Construction, Logistics">
        </div>
        <div class="form-group">
            <label>Location / City</label>
            <input type="text" id="location" placeholder="Brussels, Belgium">
        </div>
        <div class="form-group">
            <label>Bio / About</label>
            <input type="text" id="bio" placeholder="Tell us about yourself or your business">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-save" onclick="saveSettings()">Save Changes</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let userType = null;
    let workerProfileId = null;

    function showMessage(msg, isError = true) {
        const area = document.getElementById('messageArea');
        area.innerHTML = `<div class="${isError ? 'error-message' : ''}" style="padding:10px; background:${isError ? '#ffe0e0' : '#d4f5d0'}; border-radius:12px; margin-bottom:15px;">${msg}</div>`;
        setTimeout(() => { area.innerHTML = ''; }, 5000);
    }

    async function loadUserData() {
        const { data: { user }, error: userError } = await sb.auth.getUser();
        
        if (userError || !user) {
            window.location.href = 'login.html';
            return;
        }
        
        currentUser = user;
        
        const { data: profile } = await sb
            .from('profiles')
            .select('user_type')
            .eq('id', user.id)
            .single();
        
        userType = profile?.user_type || 'client';
        
        const badge = document.getElementById('userTypeBadge');
        if (userType === 'worker') {
            badge.innerHTML = '<span class="user-type-badge badge-worker"><i class="fas fa-hard-hat"></i> Worker Account</span>';
            document.getElementById('workTypeGroup').style.display = 'block';
            document.getElementById('priceGroup').style.display = 'block';
            document.getElementById('businessCategoryGroup').style.display = 'none';
            
            const { data: worker } = await sb
                .from('worker_profiles')
                .select('*')
                .eq('user_id', user.id)
                .maybeSingle();
            
            if (worker) {
                workerProfileId = worker.id;
                document.getElementById('fullName').value = worker.full_name || '';
                document.getElementById('phone').value = worker.phone_number || '';
                document.getElementById('location').value = worker.location || '';
                document.getElementById('bio').value = worker.bio || '';
                document.getElementById('workType').value = worker.work_type || '';
                document.getElementById('price').value = worker.price || '';
            }
        } else if (userType === 'company') {
            badge.innerHTML = '<span class="user-type-badge badge-company"><i class="fas fa-building"></i> Company Account</span>';
            document.getElementById('workTypeGroup').style.display = 'none';
            document.getElementById('priceGroup').style.display = 'none';
            document.getElementById('businessCategoryGroup').style.display = 'block';
            
            const { data: company } = await sb
                .from('company_profiles')
                .select('*')
                .eq('id', user.id)
                .maybeSingle();
            
            if (company) {
                document.getElementById('fullName').value = company.full_name || '';
                document.getElementById('phone').value = company.phone || '';
                document.getElementById('location').value = company.location || '';
                document.getElementById('bio').value = company.bio || '';
                document.getElementById('businessCategory').value = company.business_category || '';
            }
        } else {
            badge.innerHTML = '<span class="user-type-badge badge-client"><i class="fas fa-user"></i> Client Account</span>';
            document.getElementById('workTypeGroup').style.display = 'none';
            document.getElementById('priceGroup').style.display = 'none';
            document.getElementById('businessCategoryGroup').style.display = 'none';
            
            document.getElementById('fullName').value = profile?.full_name || '';
        }
        
        document.getElementById('email').value = user.email || '';
    }

    async function saveSettings() {
        if (!currentUser) {
            showMessage('Please login first');
            return;
        }
        
        const fullName = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const location = document.getElementById('location').value;
        const bio = document.getElementById('bio').value;
        
        if (userType === 'worker') {
            const workType = document.getElementById('workType').value;
            const price = document.getElementById('price').value;
            
            if (workerProfileId) {
                const { error } = await sb
                    .from('worker_profiles')
                    .update({
                        full_name: fullName,
                        phone_number: phone,
                        location: location,
                        bio: bio,
                        work_type: workType,
                        price: parseInt(price) || 25
                    })
                    .eq('id', workerProfileId);
                
                if (error) {
                    showMessage('Error: ' + error.message);
                } else {
                    showMessage('Settings saved successfully!', false);
                }
            } else {
                const { error } = await sb
                    .from('worker_profiles')
                    .insert({
                        user_id: currentUser.id,
                        full_name: fullName,
                        phone_number: phone,
                        location: location,
                        bio: bio,
                        work_type: workType,
                        price: parseInt(price) || 25,
                        email_address: currentUser.email,
                        status: 'available'
                    });
                
                if (error) {
                    showMessage('Error: ' + error.message);
                } else {
                    showMessage('Profile created successfully!', false);
                    loadUserData();
                }
            }
        } else if (userType === 'company') {
            const businessCategory = document.getElementById('businessCategory').value;
            
            const { error } = await sb
                .from('company_profiles')
                .upsert({
                    id: currentUser.id,
                    full_name: fullName,
                    phone: phone,
                    location: location,
                    bio: bio,
                    business_category: businessCategory,
                    email: currentUser.email
                });
            
            if (error) {
                showMessage('Error: ' + error.message);
            } else {
                showMessage('Settings saved successfully!', false);
            }
        } else {
            const { error } = await sb
                .from('profiles')
                .update({
                    full_name: fullName,
                    phone: phone,
                    location: location,
                    bio: bio
                })
                .eq('id', currentUser.id);
            
            if (error) {
                showMessage('Error: ' + error.message);
            } else {
                showMessage('Settings saved successfully!', false);
            }
        }
    }

    window.onload = loadUserData;
</script>
</body>
</html>
