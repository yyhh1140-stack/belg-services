<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — BELG SERVICES</title>

    <style>
        /* ----------------------  GENERAL  ---------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f7f9;
            color: #333;
        }

        /* ----------------------  NAVIGATION  ---------------------- */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #003366;
            padding: 15px 0;
            text-align: center;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .top-nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .top-nav a:hover {
            text-decoration: underline;
        }

        header {
            padding: 60px 20px;
            margin-top: 60px;
            background: white;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #003366;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
        }

        /* ----------------------  CONTACT FORM  ---------------------- */
        .contact-section {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: left;
        }

        .contact-section h2 {
            font-size: 24px;
            color: #003366;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #004080;
        }

        /* ----------------------  FOOTER  ---------------------- */
        .footer {
            background: #003366;
            color: white;
            padding: 25px 10px;
            text-align: center;
            margin-top: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="companies.html">Companies</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
</nav>

<header>
    <h1>Get in Touch</h1>
    <p class="subtitle">Have questions? We are here to help you.</p>
</header>

<div class="contact-section">
    <h2>Send us a Message</h2>
    <form id="contactForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="What is this about?">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>

<div class="footer">
    &copy; 2026 BELG SERVICES — Professional Business Solutions in Belgium.
</div>

<script>
    document.getElementById('contactForm').onsubmit = function(e) {
        e.preventDefault();
        alert("Thank you! Your message has been sent successfully. We will get back to you soon.");
        this.reset();
    };
</script>

</body>
</html>
