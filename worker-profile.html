<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Worker Profile - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f8ff; color: #1e2a2f; padding: 16px; }
        .profile-container { max-width: 1100px; width: 100%; margin: 0 auto; background: white; border-radius: 48px; overflow: hidden; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); }
        .cover-area { background: linear-gradient(135deg, #87CEEB, #A0D2EB); height: 65px; position: relative; }
        .cover-text { text-align: center; color: white; font-weight: 700; font-size: 0.7rem; letter-spacing: 1.5px; padding-top: 8px; text-transform: uppercase; }
        .cover-text p { margin: 2px 0; }
        .avatar-container { display: flex; flex-direction: column; align-items: center; margin-top: -30px; margin-bottom: 20px; }
        .avatar-wrapper { width: 120px; height: 120px; background-color: #e0e0e0; border-radius: 50%; border: 4px solid white; background-size: cover; background-position: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-bottom: 12px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; padding: 6px 20px; border-radius: 50px; background: #d4f5d0; color: #2e6b1f; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .status-busy { background: #ffe0b3; color: #b45f06; }
        .status-offline { background: #ffe0e0; color: #b33; }
        .profile-content { padding: 0 28px 40px 28px; }
        .name-section { text-align: center; margin: 20px 0 8px; }
        .worker-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
        .worker-location { color: #6e5e4a; margin-bottom: 12px; font-size: 0.85rem; }
        .rating { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 30px; font-size: 0.9rem; }
        .stars { color: #f5b042; letter-spacing: 2px; }
        .info-grid { background: #f9f9f9; border-radius: 28px; padding: 24px; margin: 30px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .info-item { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .info-label { font-weight: 700; min-width: 110px; color: #1a1a1a; }
        .info-value { color: #1a1a1a; }
        .section-title { font-size: 1.3rem; font-weight: 700; margin: 30px 0 16px 0; border-left: 5px solid #87CEEB; padding-left: 14px; }
        .services-list { background: #faf7f2; border-radius: 28px; padding: 8px 0; }
        .service-item { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #e9dfd3; }
        .service-name i { color: #87CEEB; width: 28px; }
        .service-price { font-weight: 700; color: #2c3e2f; }
        .badge-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 15px; }
        .badge { background: #f0e9e1; padding: 8px 16px; border-radius: 40px; font-size: 0.8rem; font-weight: 500; }
        .badge i { margin-right: 6px; color: #87CEEB; }
        .blue-stripe { background: #87CEEB; height: 4px; width: 70px; margin: 35px 0 20px; border-radius: 4px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin: 20px 0 35px; }
        .gallery img { width: 100%; height: 130px; object-fit: cover; border-radius: 20px; cursor: pointer; border: 2px solid #e0e7ff; transition: 0.2s; }
        .gallery img:hover { transform: scale(1.02); }
        .book-btn { background: #87CEEB; border: none; width: 100%; padding: 16px; font-size: 1rem; font-weight: 700; border-radius: 60px; color: #1e2a2f; margin: 20px 0 15px; cursor: pointer; transition: 0.2s; display: block; text-align: center; text-decoration: none; }
        .book-btn:hover { background: #6bb5d4; }
        .back-link { display: inline-block; margin: 20px 0 15px; text-decoration: none; color: #87CEEB; font-weight: 500; }
        @media (max-width: 680px) { .profile-content { padding: 0 20px 30px; } .worker-name { font-size: 1.5rem; } .avatar-wrapper { width: 100px; height: 100px; } }
    </style>
</head>
<body>

<div class="cover-area">
    <div class="cover-text">
        <p>🚀 WE WORK FOR YOUR COMFORT</p>
        <p>❤️ WE ARE HAPPY TO SATISFY YOU</p>
    </div>
</div>

<div class="profile-container">
    <div class="avatar-container">
        <div class="avatar-wrapper" id="workerAvatar" style="background-image: url('https://placehold.co/120');"></div>
        <div class="status-badge" id="statusBadge"><i class="fas fa-circle"></i> Loading...</div>
    </div>

    <div class="profile-content">
        <a href="companies.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Workers</a>

        <div class="name-section">
            <div class="worker-name" id="workerName">Loading...</div>
            <div class="worker-location" id="workerLocation"><i class="fas fa-map-marker-alt"></i> Loading...</div>
        </div>

        <div class="rating">
            <span class="stars">★★★★★</span> 
            <span id="ratingValue">Loading...</span>
        </div>

        <div class="info-grid" id="infoGrid">
            <div class="info-item"><span class="info-label">Skills :</span><span class="info-value" id="skills">Loading...</span></div>
            <div class="info-item"><span class="info-label">Experience :</span><span class="info-value" id="experience">Loading...</span></div>
            <div class="info-item"><span class="info-label">Phone :</span><span class="info-value" id="phone">Loading...</span></div>
            <div class="info-item"><span class="info-label">Email :</span><span class="info-value" id="email">Loading...</span></div>
        </div>

        <div class="section-title"><i class="fas fa-tools"></i> Services Offered</div>
        <div class="services-list" id="servicesList">
            <div class="service-item"><span>Loading services...</span></div>
        </div>

        <div class="section-title"><i class="fas fa-check-circle"></i> Credentials</div>
        <div class="badge-group" id="badgesContainer">
            <div class="badge">Loading...</div>
        </div>

        <div class="blue-stripe"></div>
        <div class="section-title"><i class="fas fa-camera"></i> Work Gallery</div>
        <div class="gallery" id="galleryContainer">
            <p>Loading images...</p>
        </div>

        <button class="book-btn" id="bookNowBtn"><i class="fas fa-calendar-check"></i> Book Now</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let workerId = null;
    let workerData = null;

    function getStatusClass(status) {
        if (status === 'available') return 'status-badge';
        if (status === 'busy') return 'status-badge status-busy';
        return 'status-badge status-offline';
    }

    function getStatusText(status) {
        if (status === 'available') return 'Available Now';
        if (status === 'busy') return 'Currently Busy';
        return 'Offline';
    }

    function viewImage(url) {
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.backgroundColor = 'rgba(0,0,0,0.9)';
        modal.style.zIndex = '9999';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.cursor = 'pointer';
        
        const img = document.createElement('img');
        img.src = url;
        img.style.maxWidth = '90%';
        img.style.maxHeight = '90%';
        img.style.borderRadius = '10px';
        
        modal.appendChild(img);
        document.body.appendChild(modal);
        modal.onclick = () => document.body.removeChild(modal);
    }

    async function loadWorkerProfile() {
        const params = new URLSearchParams(window.location.search);
        workerId = params.get('id');

        if (!workerId) {
            document.getElementById('workerName').innerText = "Worker ID Missing";
            return;
        }

        const { data: worker, error: workerError } = await sb
            .from('worker_profiles')
            .select('*')
            .eq('id', workerId)
            .maybeSingle();

        if (workerError || !worker) {
            console.error("Error loading worker:", workerError);
            document.getElementById('workerName').innerText = "Worker Not Found";
            return;
        }

        workerData = worker;
        
        // Update View Layer Elements
        document.getElementById('workerName').innerText = worker.full_name || 'Professional Worker';
        document.getElementById('workerLocation').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${worker.location || 'Belgium'} · ${worker.languages || 'Speaks English'}`;
        document.getElementById('ratingValue').innerText = `${worker.rating || '4.5'} (${worker.reviews || '0'} reviews)`;
        document.getElementById('skills').innerText = worker.skills || 'General Services';
        document.getElementById('experience').innerText = worker.experience || 'Not specified';
        document.getElementById('phone').innerText = worker.phone || 'Not provided';
        document.getElementById('email').innerText = worker.email || 'Not provided';
        
        if (worker.avatar_url) {
            document.getElementById('workerAvatar').style.backgroundImage = `url('${worker.avatar_url}')`;
        }
        
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = getStatusClass(worker.status || 'available');
        statusBadge.innerHTML = `<i class="fas fa-circle"></i> ${getStatusText(worker.status || 'available')}`;
        
        // Render Services
        let services = [];
        try {
            services = worker.services ? (typeof worker.services === 'string' ? JSON.parse(worker.services) : worker.services) : [];
        } catch(e) {
            services = [{ name: worker.services || 'General Services', price: 30 }];
        }
        
        const servicesContainer = document.getElementById('servicesList');
        if (services && services.length > 0) {
            servicesContainer.innerHTML = services.map(s => `
                <div class="service-item">
                    <span class="service-name"><i class="fas fa-toolbox"></i> ${s.name || s}</span>
                    <span class="service-price">$${s.price || '30'}/hr</span>
                </div>
            `).join('');
        } else {
            servicesContainer.innerHTML = `<div class="service-item"><span>Standard Maintenance ($30/hr)</span></div>`;
        }
        
        // Render Credentials & Badges
        let credentials = [];
        try {
            credentials = worker.credentials ? (typeof worker.credentials === 'string' ? JSON.parse(worker.credentials) : worker.credentials) : [];
        } catch(e) {
            credentials = [worker.credentials || 'Verified Professional'];
        }
        
        const badgesContainer = document.getElementById('badgesContainer');
        if (credentials && credentials.length > 0) {
            badgesContainer.innerHTML = credentials.map(c => `
                <div class="badge"><i class="fas fa-shield-alt"></i> ${c}</div>
            `).join('');
        } else {
            badgesContainer.innerHTML = `<div class="badge"><i class="fas fa-shield-alt"></i> Background Verified</div>`;
        }
        
        // Load Work Gallery Assets
        const { data: media } = await sb
            .from('worker_media')
            .select('*')
            .eq('worker_id', workerId)
            .order('created_at', { ascending: false });
        
        const galleryContainer = document.getElementById('galleryContainer');
        if (media && media.length > 0) {
            galleryContainer.innerHTML = media.map(img => `
                <img src="${img.media_url}" onclick="viewImage('${img.media_url}')">
            `).join('');
        } else {
            galleryContainer.innerHTML = '<p style="color:#64748b; padding-left:10px;">No gallery media cataloged yet.</p>';
        }
    }

    function requestWorker() {
        if (!workerData) {
            alert("Worker profile metadata is not initialized yet.");
            return;
        }
        window.location.href = `payment.html?worker=${workerId}&name=${encodeURIComponent(workerData.full_name)}`;
    }

    document.getElementById("bookNowBtn").addEventListener("click", requestWorker);

    window.onload = loadWorkerProfile;
</script>
</body>
</html>
