<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم كشركة - منصة الخدمات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212; /* خلفية داكنة لتناسب الموقع */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .join-container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            border-top: 5px solid #ff9800; /* الخط البرتقالي المميز */
        }

        h2 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #ff9800;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background-color: #ff9800;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
        }

        .upload-section {
            border: 2px dashed #444;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #ff9800;
        }
    </style>
</head>
<body>

<div class="join-container">
    <h2>سجل شركتك الآن 🚀</h2>
    <form id="joinForm">
        <div class="input-group">
            <label>اسم الشركة التجاري</label>
            <input type="text" placeholder="مثال: شركة السلام للمقاولات" required>
        </div>

        <div class="input-group">
            <label>البريد الإلكتروني الرسمي</label>
            <input type="email" placeholder="email@company.com" required>
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" placeholder="********" required>
        </div>

        <div class="input-group">
            <label>تخصص الشركة الرئيسي</label>
            <select>
                <option>خدمات لوجستية</option>
                <option>صيانة ومقاولات</option>
                <option>تنظيف وتعقيم</option>
                <option>تأجير معدات</option>
            </select>
        </div>

        <div class="input-group">
            <label>نبذة عن الشركة (تظهر للعملاء)</label>
            <textarea rows="3" placeholder="اكتب نبذة مختصرة عن تاريخ شركتكم وخدماتكم..."></textarea>
        </div>

        <div class="upload-section">
            <span>📁 اضغط هنا لرفع شعار الشركة (Logo)</span>
        </div>

        <button type="submit" class="btn-register">إنشاء ملف الشركة</button>
    </form>
</div>

</body>
</html>
