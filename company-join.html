<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as Company - BELG SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .join-container { background-color: #1e1e1e; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; border-top: 5px solid #FF6600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #FF6600; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: #2a2a2a; color: white; box-sizing: border-box; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: #FF6600; }
        .btn-register { width: 100%; padding: 14px; background-color: #FF6600; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-register:hover { background-color: #e65c00; }
        .btn-register:disabled { background-color: #555; cursor: not-allowed; }
        .login-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .login-link a { color: #FF6600; text-decoration: none; }
    </style>
</head>
<body>

<div class="join-container">
    <h2>Register Your Business 🚀</h2>
    <form id="joinForm">
        <div class="input-group">
            <label>Company Name</label>
            <input type="text" id="compName" placeholder="e.g. CleanPro Belgium" required>
        </div>
        <div class="input-group">
            <label>Business Email</label>
            <input type="email" id="compEmail" placeholder="contact@company.com" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="compPass" placeholder="********" required>
        </div>
        <div class="input-group">
            <label>Business Category</label>
            <select id="compSpecialty">
                <option value="Cleaning">Cleaning Services</option>
                <option value="Moving">Moving & Transport</option>
                <option value="Construction">Construction & Renovation</option>
                <option value="Maintenance">General Maintenance</option>
            </select>
        </div>
        <div class="input-group">
            <label>Short Bio</label>
            <textarea id="compBio" rows="2" placeholder="Tell clients about your services..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn-register">Create Company Account</button>
    </form>
    <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    // Configuration from your Supabase setup
    const URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const supabaseClient = window.supabase.createClient(URL, KEY);

    const joinForm = document.getElementById('joinForm');
    const submitBtn = document.getElementById('submitBtn');

    joinForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.innerText = "Creating Account...";
        submitBtn.disabled = true;

        const name = document.getElementById('compName').value;
        const email = document.getElementById('compEmail').value;
        const pass = document.getElementById('compPass').value;
        const specialty = document.getElementById('compSpecialty').value;
        const bio = document.getElementById('compBio').value;

        try {
            // 1. Sign up user in Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: pass,
            });

            if (authError) throw authError;

            if (authData.user) {
                // 2. Insert company data into 'company_profiles' table as per your screenshot
                const { error: profileError } = await supabaseClient
                    .from('company_profiles')
                    .insert([
                        { 
                            id: authData.user.id, 
                            full_name: name, 
                            business_category: specialty,
                            bio: bio,
                            email: email
                        }
                    ]);

                if (profileError) throw profileError;

                alert('Registration Successful! Redirecting to login...');
                window.location.href = 'login.html'; 
            }
        } catch (error) {
            alert('Registration Error: ' + error.message);
            submitBtn.innerText = "Create Company Account";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
