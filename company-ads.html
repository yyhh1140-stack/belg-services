<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Ads — BELG SERVICES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

/* NAV */
.top-nav {
  background: #003366;
  padding: 12px 0;
  text-align: center;
}

.top-nav a {
  color: white;
  margin: 0 12px;
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;
}

/* PAGE WRAPPER */
.wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 15px 40px;
}

/* TITLE */
.page-title {
  font-size: 22px;
  font-weight: bold;
  color: #003366;
  margin: 20px 0 15px;
  text-align: left;
}

/* ADS GRID */
.ads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

/* AD CARD */
.ad-card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  overflow: hidden;
  transition: 0.25s;
}

.ad-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

.ad-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.ad-content {
  padding: 12px;
}

.ad-content h3 {
  margin: 0 0 6px;
  font-size: 16px;
  color: #003366;
}

.ad-content p {
  margin: 0 0 10px;
  font-size: 13px;
  color: #555;
  height: 40px; /* لتوحيد حجم البطاقات */
  overflow: hidden;
}

/* BUTTON */
.ad-content a {
  display: inline-block;
  padding: 8px 14px;
  background: #003366;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.ad-content a:hover {
  background: #002244;
}
</style>
</head>

<body>
<nav style="background:#111; padding:12px; display:flex; flex-wrap:wrap; gap:12px;">
  <a href="index.html" style="color:white;">Home</a>
  <a href="about.html" style="color:white;">About</a>
  <a href="services.html" style="color:white;">Services</a>
  <a href="contact.html" style="color:white;">Contact</a>
  <a href="faq.html" style="color:white;">FAQ</a>
  <a href="pricing.html" style="color:white;">Pricing</a>
  <a href="payment.html" style="color:white;">Payment</a>
  <a href="login.html" style="color:white;">Login</a>
  <a href="register.html" style="color:white;">Register</a>
  <a href="dashboardr.html" style="color:white;">Dashboardr</a>
</nav>

<nav class="top-nav">
  <a href="index.html">Home</a>
  <a href="client.html">Find Worker</a>
  <a href="company-profile.html">Companies</a>
  <a href="worker-profile.html">Workers</a>
  <a href="payment.html">Payment</a>
  <a href="my-bookings.html">My Bookings</a>
  <a href="notifications.html">Notifications</a>
</nav>

<div class="wrapper">
  <div class="page-title">Company Advertisements</div>
  <div id="adsGrid" class="ads-grid">
      <p style="text-align: center; grid-column: 1/-1;">Loading advertisements...</p>
  </div>
</div>

<script>
// الإعدادات الخاصة بك
const URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
const KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
const sb = supabase.createClient(URL, KEY);

async function loadAds() {
    const grid = document.getElementById('adsGrid');
    
    try {
        // جلب الشركات من جدول company_profiles كما في الصورة
        const { data, error } = await sb
            .from('company_profiles')
            .select('*');

        if (error) throw error;

        if (!data || data.length === 0) {
            grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No advertisements available yet.</p>';
            return;
        }

        // بناء بطاقات الإعلانات بروابطها الصحيحة
        grid.innerHTML = data.map(company => `
            <div class="ad-card">
              <img src="${company.banner_url || 'https://i.imgur.com/clean1.jpg'}" alt="${company.full_name}">
              <div class="ad-content">
                <h3>${company.full_name || 'Business Partner'}</h3>
                <p>${company.business_category || 'Professional Services'}</p>
                <a href="company-profile.html?id=${company.id}">View Details</a>
              </div>
            </div>
        `).join('');

    } catch (err) {
        console.error("Error loading ads:", err.message);
        grid.innerHTML = `<p style="color:red; text-align: center; grid-column: 1/-1;">Error connecting to database.</p>`;
    }
}

// تشغيل الوظيفة عند التحميل
window.onload = loadAds;
</script>

</body>
</html>
