<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشركة | BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #FF6600; --dark: #0f172a; --gray: #1e293b; }
        body { font-family: 'Cairo', sans-serif; background: #0c121d; color: white; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1000px; margin: 0 auto; background: var(--gray); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 30px; }
        
        .section-box { background: #2d333d; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #3d4450; }
        .section-title { font-size: 1.2rem; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; margin-bottom: 10px; }
        
        .btn-save { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; transition: 0.3s; }
        .btn-save:hover { background: #e65c00; transform: translateY(-2px); }
        
        .badge-premium { background: #fbbf24; color: #000; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1><i class="fas fa-chart-line"></i> لوحة إدارة الشركة</h1>
    
    <div id="loading" style="text-align:center;">جاري جلب بيانات ملفك...</div>

    <form id="updateForm" style="display:none;">
        <div class="section-box">
            <div class="section-title"><i class="fas fa-info-circle"></i> الهوية التجارية</div>
            <div class="grid-inputs">
                <div>
                    <label>اسم الشركة</label>
                    <input type="text" id="fullName" required>
                </div>
                <div>
                    <label>التخصص (Category)</label>
                    <select id="category">
                        <option value="Cleaning">🧹 تنظيف (Cleaning)</option>
                        <option value="Moving">🚚 نقل أثاث (Moving)</option>
                        <option value="Construction">🏗️ مقاولات (Construction)</option>
                    </select>
                </div>
            </div>
            <label>وصف الخدمات (نبذة تظهر للعملاء)</label>
            <textarea id="bio" rows="3"></textarea>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fas fa-share-alt"></i> روابط التواصل (WhatsApp & Social)</div>
            <div class="grid-inputs">
                <div>
                    <label><i class="fab fa-whatsapp"></i> رقم الواتساب (بالصيغة الدولية)</label>
                    <input type="text" id="whatsapp" placeholder="+32XXXXXXX">
                </div>
                <div>
                    <label><i class="fab fa-facebook"></i> رابط الفيسبوك</label>
                    <input type="text" id="facebook">
                </div>
                <div>
                    <label><i class="fab fa-linkedin"></i> رابط LinkedIn</label>
                    <input type="text" id="linkedin">
                </div>
                <div>
                    <label><i class="fab fa-x-twitter"></i> رابط منصة X</label>
                    <input type="text" id="twitter">
                </div>
            </div>
        </div>

        <div class="section-box" style="border: 1px dashed var(--primary);">
            <div class="section-title">
                <i class="fas fa-video"></i> الفيديوهات والمميزات 
                <span class="badge-premium">باقة 25€ قريباً</span>
            </div>
            <p style="font-size: 0.8rem; color: #94a3b8;">هنا ستتمكن قريباً من رفع فيديوهات مشاريعك وتفعيل أيقونة "الاستجابة السريعة".</p>
        </div>

        <button type="submit" class="btn-save">حفظ التغييرات ونشر الملف</button>
    </form>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://dhvdohzjfmxmfxbinqsj.supabase.co'
    const supabaseKey = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D' // استخدم مفتاحك الخاص
    const supabase = createClient(supabaseUrl, supabaseKey)

    let userId = null;

    // 1. التحقق من هوية الشركة المسجلة
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            alert('يجب تسجيل الدخول أولاً');
            window.location.href = 'company-join.html';
            return;
        }
        userId = user.id;
        loadData();
    }

    // 2. جلب البيانات القديمة لعرضها في الخانات
    async function loadData() {
        const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .single();

        if (data) {
            document.getElementById('fullName').value = data.full_name || '';
            document.getElementById('bio').value = data.business_description || '';
            document.getElementById('category').value = data.business_category || 'Cleaning';
            document.getElementById('whatsapp').value = data.whatsapp_number || '';
            document.getElementById('facebook').value = data.facebook_url || '';
            document.getElementById('linkedin').value = data.linkedin_url || '';
            document.getElementById('twitter').value = data.twitter_url || '';
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('updateForm').style.display = 'block';
        }
    }

    // 3. حفظ التعديلات
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "جاري الحفظ...";

        const { error } = await supabase
            .from('profiles')
            .update({
                full_name: document.getElementById('fullName').value,
                business_description: document.getElementById('bio').value,
                business_category: document.getElementById('category').value,
                whatsapp_number: document.getElementById('whatsapp').value,
                facebook_url: document.getElementById('facebook').value,
                linkedin_url: document.getElementById('linkedin').value,
                twitter_url: document.getElementById('twitter').value,
                user_type: 'company' // نضمن بقاء النوع شركة
            })
            .eq('id', userId);

        if (error) {
            alert('خطأ في الحفظ: ' + error.message);
        } else {
            alert('تم تحديث بروفايل شركتك بنجاح! سيظهر الآن للعملاء بالبيانات الجديدة.');
        }
        btn.innerText = "حفظ التغييرات ونشر الملف";
    });

    checkUser();
</script>

</body>
</html>
