<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Company Portal - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* 
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fff5f0; color: #1e2a2f; }
        .company-container { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: white; border-bottom: 1px solid #ffdec2; }
        .logo-text { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #FF6600, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #2c3e2f; }
        .hero-stats { background: linear-gradient(135deg, #FF6600, #FF8C00); padding: 50px 40px; color: white; }
        .stats-grid { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 30px; text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: 800; }
        .search-section { padding: 30px 40px; background: #ffffff; border-bottom: 1px solid #ffe0cc; }
        .search-input { width: 100%; padding: 14px 20px; border: 1px solid #ffccaa; border-radius: 60px; font-size: 1rem; }
        .filter-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .filter-btn { background: #fff0e6; border: none; padding: 8px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: #FF6600; color: white; }
        .companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 30px 40px; }
        .company-card { background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.05); border: 1px solid #ffe0cc; cursor: pointer; transition: 0.3s; }
        .company-card:hover { transform: translateY(-5px); }
        .company-banner { height: 130px; background-size: cover; background-position: center; }
        .company-logo { width: 65px; height: 65px; background: white; border-radius: 50%; position: relative; top: -30px; left: 20px; border: 3px solid #FF6600; background-size: cover; }
        .company-info { padding: 0 20px 20px 20px; margin-top: -20px; }
        .view-profile-btn { background: #FF6600; border: none; width: 100%; padding: 10px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
        .footer { background: #2c3e2f; color: white; padding: 40px; text-align: center; }

        /* إضافة أيقونات الاستجابة */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .offline { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="company-container">
    <div class="navbar">
        <div class="logo-area">
            <span class="logo-text">BELG SERVICES</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="companies.html" style="color:#FF6600;">Companies</a></li>
            <li><a href="login.html" id="loginLink">Login</a></li>
            <li><a href="register.html" class="join-btn-nav" style="background:#FF6600; color:white; padding:8px 20px; border-radius:20px;">Join Now</a></li>
        </ul>
    </div>

    <div class="hero-stats">
        <div class="stats-grid" id="globalStats">
            <div class="stat-card"><div class="stat-number" id="compCount">...</div><div class="stat-label">Verified Partners</div></div>
            <div class="stat-card"><div class="stat-number">24/7</div><div class="stat-label">Support</div></div>
            <div class="stat-card"><div class="stat-number">Belgium</div><div class="stat-label">Coverage Area</div></div>
        </div>
    </div>

    <div class="search-section">
        <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search by company name or category...">
        <div class="filter-buttons">
            <button class="filter-btn active" data-cat="all">All</button>
            <button class="filter-btn" data-cat="Cleaning">🧹 Cleaning</button>
            <button class="filter-btn" data-cat="Moving">🚚 Moving</button>
            <button class="filter-btn" data-cat="Construction">🏗️ Construction</button>
        </div>
    </div>

    <div id="companiesContainer" class="companies-grid">
        </div>

    <div class="footer">
        <p>© 2025 BELG SERVICES — Belgium Business Portal</p>
    </div>
</div>

<script>
    // مفاتيح الربط الصحيحة
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allCompanies = [];

    // جلب البيانات بدون اشتراط تسجيل دخول
    async function loadCompanies() {
        const container = document.getElementById('companiesContainer');
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Loading business partners...</p>';

        const { data, error } = await _supabase
            .from('profiles')
            .select('*')
            .eq('user_type', 'company'); 

        if (error) {
            container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Connection issue. Please try again later.</p>';
            return;
        }

        allCompanies = data;
        document.getElementById('compCount').innerText = data.length;
        renderUI(allCompanies);
    }

    function renderUI(list) {
        const container = document.getElementById('companiesContainer');
        if (list.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No results found.</p>';
            return;
        }

        container.innerHTML = list.map(c => {
            // منطق "الاستجابة السريعة" - عشوائي حالياً ليعطي انطباع احترافي
            const status = Math.random() > 0.4 ? 'online' : 'offline';
            
            return `
            <div class="company-card" onclick="window.location.href='company-profile.html?id=${c.id}'">
                <div class="company-banner" style="background-image: url('${c.banner_url || 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=400'}')"></div>
                <div class="company-logo" style="background-image: url('${c.avatar_url || 'https://placehold.co/100?text=Logo'}')"></div>
                <div class="company-info">
                    <h3 class="company-name">
                        ${c.full_name || 'Business Partner'}
                        <span class="status-dot ${status}"></span>
                    </h3>
                    <p style="color:#FF6600; font-size:0.8rem; font-weight:700; margin-bottom:10px;">
                        ${c.business_category || 'Service Provider'}
                    </p>
                    <div style="color:#f5b042; margin-bottom:10px;">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i> 5.0
                    </div>
                    <button class="view-profile-btn">View Profile</button>
                </div>
            </div>
        `}).join('');
    }

    // البحث والفلترة
    document.getElementById('searchBar').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allCompanies.filter(c => 
            (c.full_name && c.full_name.toLowerCase().includes(term)) || 
            (c.business_category && c.business_category.toLowerCase().includes(term))
        );
        renderUI(filtered);
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.getAttribute('data-cat');
            const filtered = cat === 'all' ? allCompanies : allCompanies.filter(c => c.business_category === cat);
            renderUI(filtered);
        });
    });

    loadCompanies();
</script>

</body>
</html>
