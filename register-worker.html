<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل عامل - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f8ff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.8rem; color: #87CEEB; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e2a2f; }
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e7ff;
            border-radius: 28px;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #87CEEB;
        }
        textarea { resize: vertical; min-height: 100px; }
        .btn {
            width: 100%;
            background: #87CEEB;
            color: #1e2a2f;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #6bb5d4; }
        .message {
            padding: 12px;
            border-radius: 24px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success { background: #d4f5d0; color: #2e6b1f; display: block; }
        .message.error { background: #ffe0e0; color: #b33; display: block; }
        .login-link { text-align: center; margin-top: 25px; font-size: 0.85rem; }
        .login-link a { color: #87CEEB; text-decoration: none; }
        .gallery-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .gallery-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        @media (max-width: 600px) { .form-container { padding: 25px; } }
    </style>
</head>
<body>
<div class="form-container">
    <i class="fas fa-hard-hat" style="font-size: 2.5rem; color: #87CEEB;"></i>
    <h1>تسجيل عامل جديد</h1>
    <div class="subtitle">سجل بياناتك لتبدأ في تقديم الخدمات</div>
    
    <div id="messageBox" class="message"></div>
    
    <form id="registerForm">
        <div class="form-group">
            <label>الاسم الكامل *</label>
            <input type="text" id="fullName" required placeholder="مثال: أحمد محمد">
        </div>
        
        <div class="form-group">
            <label>البريد الإلكتروني *</label>
            <input type="email" id="email" required placeholder="ahmed@example.com">
        </div>
        
        <div class="form-group">
            <label>كلمة المرور *</label>
            <input type="password" id="password" required placeholder="6 أحرف على الأقل">
        </div>
        
        <div class="form-group">
            <label>نوع الخدمة *</label>
            <select id="serviceType" required>
                <option value="">اختر الخدمة</option>
                <option value="Cleaning">🧹 تنظيف</option>
                <option value="Moving">🚚 نقل أثاث</option>
                <option value="Painting">🎨 دهان</option>
                <option value="Carpentry">🔨 نجارة</option>
                <option value="Plumbing">🚰 سباكة</option>
                <option value="Electrical">⚡ كهرباء</option>
                <option value="Gardening">🌿 بستنة</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>السعر بالساعة ($) *</label>
            <input type="number" id="hourlyRate" required placeholder="مثال: 25" step="1">
        </div>
        
        <div class="form-group">
            <label>الموقع *</label>
            <input type="text" id="location" required placeholder="المدينة - المنطقة">
        </div>
        
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="phone" placeholder="رقم التواصل">
        </div>
        
        <div class="form-group">
            <label>السيرة الذاتية</label>
            <textarea id="bio" placeholder="خبراتك ومهاراتك..."></textarea>
        </div>
        
        <div class="form-group">
            <label>رابط الصورة الشخصية (اختياري)</label>
            <input type="text" id="avatarUrl" placeholder="https://...">
        </div>
        
        <button type="submit" class="btn"><i class="fas fa-user-plus"></i> تسجيل وحفظ البيانات</button>
    </form>
    
    <div class="login-link">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function showMessage(text, isError = false) {
        const msgBox = document.getElementById('messageBox');
        msgBox.textContent = text;
        msgBox.className = `message ${isError ? 'error' : 'success'}`;
        setTimeout(() => {
            msgBox.style.display = 'none';
            msgBox.className = 'message';
        }, 5000);
    }
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('fullName').value;
        const serviceType = document.getElementById('serviceType').value;
        const hourlyRate = parseInt(document.getElementById('hourlyRate').value);
        const location = document.getElementById('location').value;
        const phone = document.getElementById('phone').value;
        const bio = document.getElementById('bio').value;
        const avatarUrl = document.getElementById('avatarUrl').value;
        
        if (password.length < 6) {
            showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', true);
            return;
        }
        
        showMessage('جاري إنشاء الحساب...');
        
        // 1. إنشاء حساب في Auth
        const { data: authData, error: authError } = await sb.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName,
                    user_type: 'worker'
                }
            }
        });
        
        if (authError) {
            showMessage('خطأ: ' + authError.message, true);
            return;
        }
        
        if (!authData.user) {
            showMessage('فشل إنشاء الحساب، حاول مرة أخرى', true);
            return;
        }
        
        // 2. إنشاء سجل في worker_profiles
        const { data: workerData, error: workerError } = await sb
            .from('worker_profiles')
            .insert([{
                user_id: authData.user.id,
                full_name: fullName,
                email_address: email,
                work_type: serviceType,
                service_type: serviceType,
                price: hourlyRate,
                hourly_rate: hourlyRate,
                location: location,
                phone_number: phone,
                bio: bio,
                avatar_url: avatarUrl || null,
                status: 'available',
                rating: 4.5,
                created_at: new Date()
            }])
            .select();
            
        if (workerError) {
            console.error('Error saving worker:', workerError);
            showMessage('تم إنشاء الحساب ولكن حدث خطأ في حفظ البيانات. يرجى التواصل مع الدعم.', true);
            return;
        }
        
        const newWorkerId = workerData?.[0]?.id;
        
        showMessage('✅ تم التسجيل بنجاح! جاري التحويل...');
        
        // 3. التوجيه إلى صفحة الملف الشخصي
        setTimeout(() => {
            if (newWorkerId) {
                window.location.href = `worker-profile.html?id=${newWorkerId}`;
            } else {
                window.location.href = 'worker-dashboard.html';
            }
        }, 2000);
    });
</script>
</body>
  </html>
