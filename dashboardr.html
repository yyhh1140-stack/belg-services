<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Dashboard | BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #fffaf5; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #FF6600; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #FF6600; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #statusMessage { color: red; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <h2 style="color:#FF6600">Business Control Panel</h2>
    <div id="statusMessage">Checking connection...</div>
    
    <div id="formContent" style="display:none;">
        <label>Business Name</label>
        <input type="text" id="fn">
        
        <label>WhatsApp</label>
        <input type="text" id="wa">
        
        <label>About Services</label>
        <textarea id="bio" rows="4"></textarea>
        
        <button class="btn" onclick="updateData()">Save & Update Live</button>
        <p><a href="#" onclick="logout()" style="color:gray; font-size:12px;">Sign Out</a></p>
    </div>
</div>

<script>
    // استخدمنا المفتاح العام المباشر
    const URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const KEY = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D';
    const sb = supabase.createClient(URL, KEY);

    async function init() {
        const status = document.getElementById('statusMessage');
        
        // 1. فحص الجلسة
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
            status.innerText = "Error: Please login first.";
            setTimeout(() => window.location.href = 'login.html', 2000);
            return;
        }

        // 2. جلب البيانات (استخدام try-catch لتجنب الصفحة البيضاء)
        try {
            const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
            
            if (error || !profile) {
                status.innerText = "Error: Profile not found. Are you registered as a company?";
                return;
            }

            // ملء البيانات
            document.getElementById('fn').value = profile.full_name || '';
            document.getElementById('wa').value = profile.whatsapp_number || '';
            document.getElementById('bio').value = profile.business_description || '';
            
            // إظهار النموذج
            status.style.display = 'none';
            document.getElementById('formContent').style.display = 'block';
        } catch (e) {
            status.innerText = "Connection Error. Please refresh.";
        }
    }

    async function updateData() {
        const { data: { session } } = await sb.auth.getSession();
        const { error } = await sb.from('profiles').update({
            full_name: document.getElementById('fn').value,
            whatsapp_number: document.getElementById('wa').value,
            business_description: document.getElementById('bio').value
        }).eq('id', session.user.id);

        if (error) alert("Update failed: " + error.message);
        else alert("Update Successful! Your business card is now live.");
    }

    function logout() {
        sb.auth.signOut().then(() => window.location.href = 'login.html');
    }

    init();
</script>
</body>
</html>
