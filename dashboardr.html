</div>

<script>
    const supabaseUrl = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const supabaseKey = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    let currentUserId = null;

    window.handleLogout = function() { supabase.auth.signOut(); window.location.href = 'login.html'; };
    window.saveProfile = saveProfile;
    window.uploadMedia = uploadMedia;
    window.addAchievement = addAchievement;
    window.saveSocialLinks = saveSocialLinks;
    window.deleteMedia = deleteMedia;
    window.deleteAchievement = deleteAchievement;

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { alert("Please login"); window.location.href = 'login.html'; return; }
        currentUserId = session.user.id;
        const { data: profile } = await supabase.from('profiles').select('user_type, is_verified_company').eq('id', currentUserId).single();
        if (profile.user_type !== 'company' || !profile.is_verified_company) {
            alert("Not authorized as verified company");
            window.location.href = 'index.html';
            return;
        }
        await ensureTablesExist();
        await loadAllData();
        setupTabs();
    }

    async function ensureTablesExist() {
        const { data: existing } = await supabase.from('company_profiles').select('user_id').eq('user_id', currentUserId).single();
        if (!existing) await supabase.from('company_profiles').insert({ user_id: currentUserId, company_name: '', bio: '', category: 'Cleaning' });
        const { data: existingSocial } = await supabase.from('company_social').select('user_id').eq('user_id', currentUserId).single();
        if (!existingSocial) await supabase.from('company_social').insert({ user_id: currentUserId });
    }

    async function loadAllData() { await loadProfile(); await loadMedia(); await loadAchievements(); await loadSocialLinks(); updatePreview(); }
    async function loadProfile() { const { data } = await supabase.from('company_profiles').select('*').eq('user_id', currentUserId).single(); if(data) { document.getElementById('companyName').value = data.company_name || ''; document.getElementById('companyBio').value = data.bio || ''; document.getElementById('serviceCategory').value = data.category || 'Cleaning'; } }
    async function saveProfile() { const company_name = document.getElementById('companyName').value; const bio = document.getElementById('companyBio').value; const category = document.getElementById('serviceCategory').value; await supabase.from('company_profiles').upsert({ user_id: currentUserId, company_name, bio, category }); alert("Saved!"); updatePreview(); }
    
    async function uploadMedia() { const file = document.getElementById('mediaFile').files[0]; if(!file) { alert("Select a file"); return; } const isVideo = file.type.startsWith('video/'); const fileName = `${currentUserId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`; const { error } = await supabase.storage.from('company_media').upload(fileName, file); if(error) { alert("Upload failed: " + error.message); return; } const { data: urlData } = supabase.storage.from('company_media').getPublicUrl(fileName); await supabase.from('company_media').insert({ user_id: currentUserId, media_url: urlData.publicUrl, media_type: isVideo ? 'video' : 'image' }); alert("Uploaded!"); document.getElementById('mediaFile').value = ''; loadMedia(); updatePreview(); }
    
    async function loadMedia() { const { data } = await supabase.from('company_media').select('*').eq('user_id', currentUserId).order('created_at', {ascending:false}); const gallery = document.getElementById('mediaGallery'); gallery.innerHTML = ''; if(data && data.length) { data.forEach(item => { const div = document.createElement('div'); div.className = 'media-item'; if(item.media_type === 'image') div.innerHTML = `<img src="${item.media_url}" onclick="window.open('${item.media_url}')"><button class="delete-btn" onclick="deleteMedia('${item.id}', '${item.media_url}')">Delete</button>`; else div.innerHTML = `<video src="${item.media_url}" controls></video><button class="delete-btn" onclick="deleteMedia('${item.id}', '${item.media_url}')">Delete</button>`; gallery.appendChild(div); }); } else gallery.innerHTML = '<p>No media yet</p>'; }
    
    async function deleteMedia(mediaId, mediaUrl) { if(confirm("Delete?")) { const path = mediaUrl.split('/storage/v1/object/public/company_media/')[1]; if(path) await supabase.storage.from('company_media').remove([path]); await supabase.from('company_media').delete().eq('id', mediaId); loadMedia(); updatePreview(); } }
    
    async function addAchievement() { const title = document.getElementById('achievementTitle').value; const description = document.getElementById('achievementDesc').value; const image_url = document.getElementById('achievementImage').value; if(!title) { alert("Enter title"); return; } await supabase.from('company_achievements').insert({ user_id: currentUserId, title, description, image_url }); alert("Added!"); document.getElementById('achievementTitle').value = ''; document.getElementById('achievementDesc').value = ''; document.getElementById('achievementImage').value = ''; loadAchievements(); updatePreview(); }
    
    async function loadAchievements() { const { data } = await supabase.from('company_achievements').select('*').eq('user_id', currentUserId).order('created_at', {ascending:false}); const listDiv = document.getElementById('achievementsList'); listDiv.innerHTML = ''; if(data && data.length) { data.forEach(ach => { const item = document.createElement('div'); item.style.background='#f8fafc'; item.style.padding='15px'; item.style.marginBottom='10px'; item.style.borderRadius='16px'; item.innerHTML = `<strong>${ach.title}</strong><p>${ach.description || ''}</p>${ach.image_url ? `<img src="${ach.image_url}" width="80">` : ''}<button style="background:#ef4444;color:white;border:none;padding:6px 15px;border-radius:30px;margin-top:8px;" onclick="deleteAchievement('${ach.id}')">Delete</button>`; listDiv.appendChild(item); }); } else listDiv.innerHTML = '<p>No achievements</p>'; }
    
    async function deleteAchievement(id) { if(confirm("Delete?")) { await supabase.from('company_achievements').delete().eq('id', id); loadAchievements(); updatePreview(); } }
    
    async function saveSocialLinks() { const whatsapp = document.getElementById('whatsappLink').value; const facebook = document.getElementById('facebookLink').value; const instagram = document.getElementById('instagramLink').value; const twitter = document.getElementById('twitterLink').value; const tiktok = document.getElementById('tiktokLink').value; const website = document.getElementById('websiteLink').value; await supabase.from('company_social').upsert({ user_id: currentUserId, whatsapp, facebook, instagram, twitter, tiktok, website }); alert("Links saved!"); updatePreview(); }
    
    async function loadSocialLinks() { const { data } = await supabase.from('company_social').select('*').eq('user_id', currentUserId).single(); if(data) { document.getElementById('whatsappLink').value = data.whatsapp || ''; document.getElementById('facebookLink').value = data.facebook || ''; document.getElementById('instagramLink').value = data.instagram || ''; document.getElementById('twitterLink').value = data.twitter || ''; document.getElementById('tiktokLink').value = data.tiktok || ''; document.getElementById('websiteLink').value = data.website || ''; } }
    
    async function updatePreview() { const { data: profile } = await supabase.from('company_profiles').select('*').eq('user_id', currentUserId).single(); if(profile) { document.getElementById('previewCompanyName').innerHTML = profile.company_name || 'My Company'; document.getElementById('previewBio').innerText = profile.bio || ''; } const { data: social } = await supabase.from('company_social').select('*').eq('user_id', currentUserId).single(); const iconsDiv = document.getElementById('previewSocialIcons'); iconsDiv.innerHTML = ''; if(social) { if(social.whatsapp) iconsDiv.innerHTML += `<a href="${social.whatsapp}" target="_blank"><i class="fab fa-whatsapp"></i></a>`; if(social.facebook) iconsDiv.innerHTML += `<a href="${social.facebook}" target="_blank"><i class="fab fa-facebook-f"></i></a>`; if(social.instagram) iconsDiv.innerHTML += `<a href="${social.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>`; if(social.twitter) iconsDiv.innerHTML += `<a href="${social.twitter}" target="_blank"><i class="fab fa-twitter"></i></a>`; if(social.tiktok) iconsDiv.innerHTML += `<a href="${social.tiktok}" target="_blank"><i class="fab fa-tiktok"></i></a>`; if(social.website) iconsDiv.innerHTML += `<a href="${social.website}" target="_blank"><i class="fas fa-globe"></i></a>`; } } const { data: media } = await supabase.from('company_media').select('*').eq('user_id', currentUserId).limit(6); const previewMedia = document.getElementById('previewMedia'); previewMedia.innerHTML = ''; if(media && media.length) { media.forEach(m => { const el = document.createElement('div'); el.className = 'media-item'; if(m.media_type === 'image') el.innerHTML = `<img src="${m.media_url}" style="height:100px;">`; else el.innerHTML = `<video src="${m.media_url}" style="height:100px;"></video>`; previewMedia.appendChild(el); }); } const { data: achievements } = await supabase.from('company_achievements').select('*').eq('user_id', currentUserId).limit(3); const previewAch = document.getElementById('previewAchievements'); previewAch.innerHTML = ''; if(achievements && achievements.length) { achievements.forEach(a => { previewAch.innerHTML += `<div class="achievement-item"><strong>${a.title}</strong><br>${a.description || ''}</div>`; }); } }
    
    function setupTabs() { const btns = document.querySelectorAll('.tab-btn'); const contents = document.querySelectorAll('.tab-content'); btns.forEach(btn => { btn.onclick = () => { btns.forEach(b => b.classList.remove('active')); btn.classList.add('active'); contents.forEach(c => c.style.display = 'none'); document.getElementById(`tab-${btn.dataset.tab}`).style.display = 'block'; if(btn.dataset.tab === 'preview') updatePreview(); if(btn.dataset.tab === 'media') loadMedia(); if(btn.dataset.tab === 'achievements') loadAchievements(); }; }); }
    
    init();
</script>
</body>
</html>
