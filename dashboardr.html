<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #FF6600; --bg: #fffaf5; --dark: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); margin: 0; padding: 0; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #ffe0cc; padding: 30px 20px; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding: 40px; }
        .dash-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid #ffe0cc; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn-save:hover { background: #e65c00; }
        .logo-text { font-size: 1.6rem; font-weight: 800; color: var(--primary); text-decoration: none; margin-bottom: 40px; display: block; }
    </style>
</head>
<body>

<div class="wrapper" id="mainWrapper" style="display:none;">
    <div class="sidebar">
        <a href="index.html" class="logo-text">BELG SERVICES</a>
        <p><strong>Company Panel</strong></p>
        <hr style="width:100%; border:0; border-top:1px solid #eee; margin: 20px 0;">
        <a href="index.html" style="text-decoration:none; color:var(--dark);"><i class="fas fa-home"></i> View Site</a>
        <br>
        <a href="#" onclick="handleLogout()" style="color:red; text-decoration:none; margin-top:20px; display:block;"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="dash-card">
            <h1>Update Business Profile</h1>
            <p style="color: #64748b;">This information will be displayed on your public profile page.</p>
            
            <form id="profileForm">
                <div class="form-grid">
                    <div>
                        <label>Company Name</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div>
                        <label>Service Category</label>
                        <select id="category">
                            <option value="Cleaning">Cleaning Services</option>
                            <option value="Moving">Moving & Transport</option>
                            <option value="Construction">Construction & Renovation</option>
                        </select>
                    </div>
                    <div>
                        <label>WhatsApp Number</label>
                        <input type="text" id="whatsapp">
                    </div>
                    <div>
                        <label>Facebook Page</label>
                        <input type="url" id="facebook">
                    </div>
                    <div class="full-width">
                        <label>About Business</label>
                        <textarea id="bio" rows="5"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-save" id="saveBtn">Save & Sync Live</button>
            </form>
        </div>
    </div>
</div>

<script>
    // استخدام المتغيرات العادية بدلاً من Module لتجنب مشاكل المتصفح
    const supabaseUrl = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const supabaseKey = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUserId = null;

    async function start() {
        // فحص الجلسة بدون تعقيد
        const { data: { session } } = await _supabase.auth.getSession();

        if (!session) {
            alert("No active session. Redirecting to login...");
            window.location.href = 'login.html';
            return;
        }

        currentUserId = session.user.id;
        
        // جلب البيانات
        const { data: profile, error } = await _supabase
            .from('profiles')
            .select('*')
            .eq('id', currentUserId)
            .single();

        if (profile) {
            document.getElementById('fullName').value = profile.full_name || '';
            document.getElementById('category').value = profile.business_category || 'Cleaning';
            document.getElementById('whatsapp').value = profile.whatsapp_number || '';
            document.getElementById('facebook').value = profile.facebook_url || '';
            document.getElementById('bio').value = profile.business_description || '';
            
            // إظهار المحتوى بعد التأكد من كل شيء
            document.getElementById('mainWrapper').style.display = 'flex';
        } else {
            alert("Profile not found.");
        }
    }

    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Saving...";
        btn.disabled = true;

        const { error } = await _supabase.from('profiles').update({
            full_name: document.getElementById('fullName').value,
            business_category: document.getElementById('category').value,
            whatsapp_number: document.getElementById('whatsapp').value,
            facebook_url: document.getElementById('facebook').value,
            business_description: document.getElementById('bio').value
        }).eq('id', currentUserId);

        if (error) alert("Error: " + error.message);
        else alert("Update Successful!");
        
        btn.innerText = "Save & Sync Live";
        btn.disabled = false;
    };

    function handleLogout() {
        _supabase.auth.signOut().then(() => {
            window.location.href = 'login.html';
        });
    }

    // انطلاق!
    start();
</script>

</body>
</html>
