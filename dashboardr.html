<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* التنسيقات (نفس تنسيقات الكود الخرافي الخاص بك) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #FF6600; padding: 20px; border-radius: 20px; color: white; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn { background: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #FF6600; color: white; }
        .card { background: white; border-radius: 24px; padding: 30px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input, textarea, select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 8px; }
        .btn { background: #FF6600; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 15px; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .media-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 5px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">🏢 BELG SERVICES | Dashboard</div>
        <button onclick="handleLogout()" style="background:none; border:1px solid white; color:white; padding:8px 15px; border-radius:10px; cursor:pointer;">Logout</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('profile')">📋 Profile</button>
        <button class="tab-btn" onclick="showTab('media')">🖼️ Media</button>
        <button class="tab-btn" onclick="showTab('achievements')">🏆 Achievements</button>
        <button class="tab-btn" onclick="showTab('social')">🔗 Social</button>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="card">
            <h2>Company Info</h2>
            <label>Name</label><input type="text" id="companyName">
            <label>Bio</label><textarea id="companyBio" rows="4"></textarea>
            <label>Category</label>
            <select id="serviceCategory">
                <option value="Cleaning">Cleaning</option>
                <option value="Construction">Construction</option>
                <option value="Moving">Moving</option>
            </select>
            <button class="btn" onclick="saveProfile()">Save Profile</button>
        </div>
    </div>

    <div id="tab-media" class="tab-content" style="display:none;">
        <div class="card">
            <h2>Gallery</h2>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <button class="btn" onclick="uploadMedia()">Upload File</button>
            <div id="mediaGallery" class="media-grid" style="margin-top:20px;"></div>
        </div>
    </div>

    </div>

<script>
    const supabaseUrl = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const supabaseKey = 'sb_publishable_53zXqL7fXvF3GfHnJ5nN8V5e6B2p0D';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUserId = null;

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUserId = session.user.id;

        // تأكد من وجود سجل للشركة عند الدخول لأول مرة
        await ensureRecordsExist();
        loadAllData();
    }

    async function ensureRecordsExist() {
        // فحص وجود سجل البروفايل
        const { data: profile } = await _supabase.from('company_profiles').select('user_id').eq('user_id', currentUserId).single();
        if (!profile) {
            await _supabase.from('company_profiles').insert([{ user_id: currentUserId, company_name: '', bio: '', category: 'Cleaning' }]);
        }
        // فحص وجود سجل الروابط الاجتماعية
        const { data: social } = await _supabase.from('company_social').select('user_id').eq('user_id', currentUserId).single();
        if (!social) {
            await _supabase.from('company_social').insert([{ user_id: currentUserId, whatsapp: '', facebook: '' }]);
        }
    }

    async function loadAllData() {
        // جلب البروفايل
        const { data: p } = await _supabase.from('company_profiles').select('*').eq('user_id', currentUserId).single();
        if (p) {
            document.getElementById('companyName').value = p.company_name || '';
            document.getElementById('companyBio').value = p.bio || '';
            document.getElementById('serviceCategory').value = p.category || 'Cleaning';
        }
        loadMedia();
    }

    async function saveProfile() {
        const { error } = await _supabase.from('company_profiles').upsert({
            user_id: currentUserId,
            company_name: document.getElementById('companyName').value,
            bio: document.getElementById('companyBio').value,
            category: document.getElementById('serviceCategory').value
        });
        if (error) alert(error.message); else alert("Saved!");
    }

    async function loadMedia() {
        const { data } = await _supabase.from('company_media').select('*').eq('user_id', currentUserId);
        const gallery = document.getElementById('mediaGallery');
        gallery.innerHTML = data && data.length ? data.map(item => `
            <div class="media-item">
                <img src="${item.media_url}">
                <button class="delete-btn" onclick="deleteMedia('${item.id}')">Delete</button>
            </div>
        `).join('') : '<p>No media yet.</p>';
    }

    // دوال التنقل بين التبويبات
    window.showTab = (tabId) => {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tabId).style.display = 'block';
        event.target.classList.add('active');
    };

    function handleLogout() {
        _supabase.auth.signOut().then(() => window.location.href = 'login.html');
    }

    init();
</script>
</body>
</html>
