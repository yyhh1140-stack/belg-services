<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BELG SERVICES - Company Dashboard (Fixed)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #fefcf5; padding: 15px; color: #1e2a2f; }
        .header { background: #FF6600; padding: 25px; border-radius: 24px; color: white; margin-bottom: 20px; }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .tab-btn { background: white; border: 1px solid #ddd; padding: 12px 20px; border-radius: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #FF6600; color: white; border-color: #FF6600; }
        .card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #f0e4d8; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
        .btn-action { background: #FF6600; color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 800; width: 100%; font-size: 16px; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Company Dashboard</h2>
        <p id="statusInfo" style="font-size: 13px; opacity: 0.9;">Checking Auth...</p>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('profile', this)">📋 Profile</button>
        <button class="tab-btn" onclick="switchTab('media', this)">🖼️ Gallery</button>
    </div>

    <div id="profile" class="tab-content active">
        <div class="card">
            <label>Company Name</label>
            <input type="text" id="companyNameInput">
            <button class="btn-action" onclick="handleSaveProfile()">💾 Save Changes</button>
        </div>
    </div>

    <div id="media" class="tab-content">
        <div class="card">
            <input type="file" id="fileInput">
            <button class="btn-action" onclick="alert('Upload system connecting...')">📤 Upload</button>
        </div>
    </div>

<script>
    // Configuration - Using your specific keys
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    async function validateSession() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                // IMPORTANT: Redirect to login if no user found
                window.location.href = "login.html";
            } else {
                document.getElementById('statusInfo').innerText = "Connected: " + user.email;
            }
        } catch (err) {
            console.error("Auth Error:", err);
        }
    }

    async function handleSaveProfile() {
        try {
            const name = document.getElementById('companyNameInput').value;
            const { data: { user } } = await supabase.auth.getUser();
            
            const { error } = await supabase.from('company_profiles').upsert({ 
                user_id: user.id, 
                company_name: name 
            });

            if (error) throw error;
            alert("✅ Data Saved to dashboardr!");
        } catch (err) {
            alert("❌ Error: " + err.message);
        }
    }

    // Run on start
    window.addEventListener('DOMContentLoaded', validateSession);
</script>
</body>
</html>
