<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BELG SERVICES - Company Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #fefcf5; padding: 15px; color: #1e2a2f; }
        
        .header { background: #FF6600; padding: 25px; border-radius: 24px; color: white; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2); }
        .header h2 { font-size: 22px; font-weight: 800; }
        
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: white; border: 1px solid #e0e0e0; padding: 12px 20px; border-radius: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: #FF6600; color: white; border-color: #FF6600; }

        .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 6px 16px rgba(0,0,0,0.04); border: 1px solid #f0e4d8; margin-bottom: 20px; }
        
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: #444; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
        
        .btn-action { background: #FF6600; color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 800; width: 100%; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(255, 102, 0, 0.2); }
        .btn-action:active { transform: scale(0.97); }
        
        .logout-btn { background: #333; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; width: 100%; margin-top: 20px; cursor: pointer; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Company Dashboard</h2>
        <p id="statusInfo" style="font-size: 13px; opacity: 0.9; margin-top: 5px;">Checking connection...</p>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('profile', this)">📋 Profile</button>
        <button class="tab-btn" onclick="switchTab('media', this)">🖼️ Gallery</button>
        <button class="tab-btn" onclick="switchTab('social', this)">🔗 Social</button>
    </div>

    <div id="profile" class="tab-content active">
        <div class="card">
            <label>Registered Company Name</label>
            <input type="text" id="companyNameInput" placeholder="Enter name...">
            <button class="btn-action" onclick="handleSaveProfile()">💾 Save Changes</button>
        </div>
    </div>

    <div id="media" class="tab-content">
        <div class="card">
            <label>Upload Portfolio Media</label>
            <input type="file" id="fileInput">
            <button class="btn-action" onclick="handleUpload()">📤 Upload to Server</button>
        </div>
    </div>

    <div id="social" class="tab-content">
        <div class="card">
            <label>WhatsApp Business Link</label>
            <input type="text" id="waInput" placeholder="https://wa.me/...">
            <button class="btn-action" onclick="handleSaveSocial()">🔗 Update Links</button>
        </div>
    </div>

    <button class="logout-btn" onclick="triggerLogout()">Sign Out</button>

<script>
    // Configuration
    const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. Tab Switcher Logic
    function switchTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    // 2. Authentication Check
    async function validateSession() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = "login.html";
            } else {
                document.getElementById('statusInfo').innerText = "Logged in as: " + user.email;
                fetchInitialData(user.id);
            }
        } catch (err) {
            alert("Connection Error: " + err.message);
        }
    }

    // 3. Save Profile Logic
    async function handleSaveProfile() {
        try {
            const name = document.getElementById('companyNameInput').value;
            if (!name) return alert("Please enter a name first");

            const { data: { user } } = await supabase.auth.getUser();
            const { error } = await supabase.from('company_profiles').upsert({ 
                user_id: user.id, 
                company_name: name 
            });

            if (error) throw error;
            alert("✅ Success: Profile Updated!");
        } catch (err) {
            alert("❌ Save Failed: " + err.message);
        }
    }

    // 4. Logout Logic
    async function triggerLogout() {
        await supabase.auth.signOut();
        window.location.href = "login.html";
    }

    // Initial Load
    window.addEventListener('DOMContentLoaded', validateSession);
</script>
</body>
</html>
